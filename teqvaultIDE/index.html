  <!--
    Theme switcher fonts (see src/themes.js / src/themes.css). Google Fonts
    covers Space Grotesk, JetBrains Mono, Inter, Fira Code, IBM Plex Mono,
    and Plus Jakarta Sans directly. Satoshi isn't on Google Fonts, so it's
    loaded from Fontshare (its home foundry) instead. Geist Sans/Mono aren't
    reliably hosted on either CDN as of this writing, so those two themes
    fall back to a close system-font stack in themes.js rather than link to
    a webfont that might 404.
  -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&family=Fira+Code:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />
  <link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700&display=swap" rel="stylesheet" />
